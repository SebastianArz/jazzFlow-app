# ============================================================================
#  Android-Test-APK bauen (JazzFlow Huelle)
#  Startet bei jeder Aenderung im Repo oder per Hand (Actions -> Run workflow).
#  Ergebnis: unter "Artifacts" die Datei jazzflow-test-apk (ZIP mit app-debug.apk)
# ============================================================================
name: Android Test-APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Pakete installieren
        run: npm install --no-audit --no-fund

      - name: Android-Projekt erzeugen und anpassen
        run: |
          npx cap add android
          npx cap sync android
          node scripts/patch-android.mjs
          node scripts/make-icons.mjs

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: jazzflow-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
